<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24180f">
<title>Nitz Cafe’ POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0c0a08;--bar:#24180f;--panel:#1a130d;--tile:#4a3524;--ink:#f4eadb;--mute:#b5a088;--line:#3a2b1d;--g:#c48a50;--gd:#a9733f;--gi:#1a1109;--bad:#ef7b6d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #ffd54f;outline-offset:2px}
#app{display:grid;grid-template-columns:1fr 360px;height:100%}
.left{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:6px;background:var(--bar);padding:6px 10px;height:56px;flex:none}
.top h1{flex:1;margin:0;font-size:19px;font-weight:500;padding-left:6px}
.ib{background:none;border:0;width:42px;height:42px;border-radius:50%;font-size:20px}
.ib:hover{background:rgba(128,128,128,.2)}
#sq{display:none;flex:1;background:transparent;border:0;border-bottom:2px solid var(--g);padding:6px;outline:0}
.grid{flex:1;overflow:auto;padding:4px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));grid-auto-rows:128px;gap:4px;align-content:start}
.tile{position:relative;border:0;border-radius:2px;background:var(--tile) center/cover;color:#fff;padding:0;overflow:hidden;text-align:center}
.tile .ini{position:absolute;inset:0 0 34px;display:grid;place-items:center;font-size:38px;font-weight:700;opacity:.55}
.tile .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:14px;line-height:1.15}
.tile .pr{position:absolute;top:5px;right:6px;background:rgba(0,0,0,.6);border-radius:10px;padding:1px 7px;font-size:12px}
.tile.out{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.tile.cat{background:var(--g)}
.tile.dc{background:var(--tile);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile.dc span{font-size:30px}
.tabs{display:flex;background:var(--bar);flex:none;overflow-x:auto;border-top:1px solid var(--line)}
.tabs button{flex:none;background:none;border:0;padding:0 18px;height:56px;color:var(--mute);font-weight:600;letter-spacing:.03em;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--g)}
.right{background:var(--panel);display:flex;flex-direction:column;height:100%;border-left:1px solid var(--line)}
.right .top h1{padding-left:8px}
.dine{margin:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 16px;width:100%;appearance:auto}
.dine option{color:#000}
.lines{flex:1;overflow:auto}
.ln{display:flex;align-items:center;gap:6px;padding:12px 16px}
.ln .t{flex:1}.ln small{color:var(--mute)}
.ln .q{display:flex;gap:4px;align-items:center}
.ln .q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none}
.sum{border-top:1px solid var(--line);padding:6px 16px}
.sr{display:flex;justify-content:space-between;padding:8px 0;color:var(--mute)}
.sr.t{color:var(--ink);font-weight:700;font-size:17px}
.act{display:flex;margin:10px;gap:2px}
.act button{flex:1;height:60px;border:0;background:var(--g);color:var(--gi);font-weight:700;letter-spacing:.04em}
.act button:hover{background:var(--gd)}
.act button:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--mute);text-align:center;padding:30px 16px}
.mbar{display:none}
@media (max-width:820px){
 #app{grid-template-columns:1fr}
 .right{position:fixed;inset:0;z-index:5;display:none;border:0}
 body.tk .right{display:flex}
 .mbar{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--g);color:var(--gi);border:0;border-radius:6px;height:50px;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700}
 .grid{padding-bottom:70px}
}
/* drawer + back office */
#drawer{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.5)}
#drawer.on{display:block}
#drawer nav{width:270px;max-width:85%;height:100%;background:var(--bar);padding:10px 0}
#drawer nav b{display:block;padding:14px 20px;font-size:18px}
#drawer nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 20px}
#drawer nav button:hover{background:rgba(128,128,128,.2)}
#back{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
#back.on{display:flex}
#bb{flex:1;overflow:auto;padding:14px;max-width:960px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}.n{text-align:right}
.sc{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.stat span{color:var(--mute);display:block}.stat b{font-size:21px}
.btn{background:var(--g);color:var(--gi);border:0;border-radius:4px;padding:10px 16px;font-weight:700}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.4}
input,select{background:var(--bar);border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-width:0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:92%;max-width:400px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 12px;font-size:19px}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;color:var(--mute)}
.qk{display:flex;gap:6px;flex-wrap:wrap}.qk button{flex:1;padding:9px;border:1px solid var(--line);background:none;border-radius:4px}
.row{display:flex;justify-content:space-between;padding:3px 0}
.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.ph{width:44px;height:44px;border-radius:4px;background:var(--tile) center/cover;display:inline-block;vertical-align:middle;margin-right:8px}
.low{color:var(--bad);font-weight:700}

body:not(.in) #app,body:not(.in) .mbar{visibility:hidden}
#pa{display:none}
.sm{padding:6px 9px!important;font-size:13px!important}
.seg{display:flex;justify-content:center;gap:4px;margin-bottom:10px}
.seg button{background:none;border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.seg button[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--gi)}
.dnav{display:flex;align-items:center;justify-content:space-between;font-size:20px;margin-bottom:8px}
.dnav button:disabled{opacity:.3;cursor:default}
.rings{display:flex;justify-content:center;align-items:flex-start;gap:4px;margin:6px 0 16px}
.rg{flex:1;max-width:210px;text-align:center}.rg svg{width:100%}.rg.mid{flex:1.3;max-width:260px}
.rg .rl{font-size:16px;margin-top:-2px;white-space:nowrap}.rg .rp{font-size:14px;margin-top:2px}
.chart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:no-preference){
.an .arc{animation:sweep 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 400}}
.an .dot{transform-origin:60px 60px;animation:orbit 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes orbit{from{transform:rotate(calc(var(--r)*-1deg))}}
.an .br{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*20ms + .2s)}
@keyframes grow{from{transform:scaleY(0)}}
.an .rl,.an .rp{animation:fade .6s .5s both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}}
.vd td{opacity:.5;text-decoration:line-through}.vd td:last-child{text-decoration:none;opacity:1}
.badge{display:inline-block;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:0 8px;font-size:12px}
.acts{white-space:nowrap}.acts button{margin-left:4px}
#net{position:fixed;left:10px;bottom:70px;z-index:40;background:#7a2e1f;color:#fff;border-radius:16px;padding:6px 12px;font-size:13px;display:none}
/* touch + tablet polish */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
button,.tile{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@supports(height:100dvh){html,body,#app{height:100dvh}}
.grid,.lines,#bb,#drawer nav,#back,.sc,.tabs,dialog{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{min-width:92px;transition:color .15s,border-color .15s}
button{transition:transform .12s ease,background-color .15s,opacity .15s,border-color .15s}
button:active:not(:disabled){transform:scale(.97)}
.tile{transition:transform .12s ease,filter .2s}
.tile:active:not(.out){transform:scale(.95)}
.tile .nm{font-size:15px}
.btn,.chip,.qk button,#drawer nav button{min-height:46px}
.btn.sm{min-height:38px}
.ib{width:48px;height:48px}
.ln .q button{width:38px;height:38px;font-size:18px}
input,select{min-height:44px;font-size:16px}
.pad button{font-size:24px;transition:background-color .12s}
#drawer{display:block!important;visibility:hidden;opacity:0;transition:opacity .22s,visibility 0s .22s}
#drawer.on{visibility:visible;opacity:1;transition:opacity .22s}
#drawer nav{transform:translateX(-100%);transition:transform .27s cubic-bezier(.2,.8,.2,1)}
#drawer.on nav{transform:none}
#back{display:flex!important;visibility:hidden;opacity:0;transform:translateY(14px);transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
#back.on{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1)}
dialog{max-height:92dvh;overflow:auto;max-width:440px}
dialog[open]{animation:dpop .22s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:dfade .22s}
@keyframes dpop{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes dfade{from{opacity:0}}
@media (max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
@media (max-width:820px){body.tk .right{animation:slidein .27s cubic-bezier(.2,.8,.2,1)}@keyframes slidein{from{transform:translateX(100%)}}}
@media (min-width:640px) and (max-width:820px){#app{grid-template-columns:1fr 300px}.right,body.tk .right{position:static;display:flex;border-left:1px solid var(--line);animation:none}.mbar{display:none}.grid{padding-bottom:4px}#tback{display:none!important}}
@media (min-width:1100px){#app{grid-template-columns:1fr 400px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:150px}}
@media (prefers-reduced-motion:reduce){*,::backdrop{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* scroll fix: lock the layout to the screen so inner lists scroll */
#app{grid-template-rows:minmax(0,1fr)}
.left,.right{min-height:0;overflow:hidden}
.grid,.lines,#bb{min-height:0;overflow-y:auto}
.tabs{flex:none;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
#drawer nav{overflow-y:auto}
/* easy scrolling: big scroll buttons, category arrows, thick scrollbars */
.left{position:relative}
.tw{display:flex;flex:none;background:var(--bar);border-top:1px solid var(--line)}
.tw .tabs{flex:1 1 auto;min-width:0;border-top:0}
.ta{flex:none;width:46px;border:0;background:var(--bar);color:var(--ink);font-size:26px}
.sb{position:absolute;right:16px;bottom:76px;display:flex;flex-direction:column;gap:10px;z-index:3}
.sb button{width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:var(--gi);font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.45);opacity:.92}
.grid,.lines,#bb,.sc{scrollbar-width:auto;scrollbar-color:#7a7a7a var(--bar)}
.grid::-webkit-scrollbar,.lines::-webkit-scrollbar,#bb::-webkit-scrollbar,.sc::-webkit-scrollbar{width:14px;height:14px}
.grid::-webkit-scrollbar-thumb,.lines::-webkit-scrollbar-thumb,#bb::-webkit-scrollbar-thumb,.sc::-webkit-scrollbar-thumb{background:#7a7a7a;border-radius:8px;border:3px solid var(--bar)}
.grid{cursor:grab}
/* tile sizes: S (default), M, L */
#grid.ts-s{--ts:88px}#grid.ts-m{--ts:108px}#grid.ts-l{--ts:132px}
#grid.grid{grid-template-columns:repeat(auto-fill,minmax(var(--ts,88px),1fr));grid-auto-rows:var(--ts,88px);gap:4px}
#grid.ts-s .nm{font-size:12px;line-height:1.1;padding:12px 3px 4px}
#grid.ts-s .pr{font-size:10px;padding:0 5px;top:3px;right:3px}
#grid.ts-s .ini{font-size:24px;inset:0 0 26px}
#grid.ts-m .nm{font-size:13.5px;padding:14px 4px 6px}
#grid.ts-m .pr{font-size:11px}
#tsz{width:auto;min-width:56px;padding:0 10px;font-size:15px;font-weight:700;border-radius:24px}
@media (max-width:639px){.mbar{bottom:calc(66px + env(safe-area-inset-bottom,0px))}.sb{bottom:134px}.grid{padding-bottom:128px}}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}body>*:not(#pa){display:none!important}#pa{display:block!important;color:#000;background:#fff;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:2mm 3mm}#pa .row{display:flex;justify-content:space-between;gap:6px;padding:1px 0}#pa hr{border:0;border-top:1px dashed #000;margin:5px 0}#pa .c{text-align:center}}
#login{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at top,#2e1f13,#0c0a08 72%);color:var(--ink);display:none;flex-direction:column;align-items:center;overflow:auto;border-top:3px solid var(--g)}
#login .brand{margin-top:16px;font-size:26px;font-weight:800;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:6px}.lgimg{height:min(170px,20vh);width:auto}
#login .tc{position:absolute;top:14px;right:16px;background:transparent;border:1px solid var(--g);color:var(--g);border-radius:3px;padding:12px 16px;font-weight:600}
#lgm{margin:14px 0 10px;min-height:20px;color:var(--mute);text-align:center;padding:0 16px}
#lgm.err{color:var(--bad)}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:6px}
.dots i{width:16px;height:16px;border:2px solid var(--g);border-radius:50%}
.dots i.on{background:var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);width:min(600px,94%);border:1px solid var(--line);margin:18px 0}
.pad button{height:min(12vh,92px);background:rgba(36,24,15,.85);border:1px solid var(--line);font-size:22px;color:var(--ink)}
.pad button:active{background:#3a2818}
#setupw{width:min(380px,92%);margin:20px 0;display:none}
#setupw .f label{color:var(--mute)}#setupw input{background:#14100c;color:var(--ink);border-color:var(--line)}
#drawer nav small{display:block;padding:0 20px 8px;color:var(--mute)}
.top,.tw,#drawer nav{background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.03) 0 1px,transparent 1px 9px,rgba(0,0,0,.2) 9px 10px,transparent 10px 23px)}
.dl{display:block;height:64px;width:auto;margin:10px 20px 4px}
</style>
</head>
<body>
<div id="app">
 <section class="left">
  <div class="top"><button class="ib" id="menu" aria-label="Menu">☰</button><h1 id="ttl">Favorites</h1><input id="sq" type="search" placeholder="Search items" aria-label="Search items"><button class="ib" id="tsz" aria-label="Change tile size" title="Tile size"></button><button class="ib" id="srch" aria-label="Search">⌕</button></div>
  <div class="grid" id="grid"></div>
  <div class="sb"><button id="su" aria-label="Scroll up">▲</button><button id="sd" aria-label="Scroll down">▼</button></div>
  <div class="tw"><button class="ta" id="tl" aria-label="Previous categories">‹</button><div class="tabs" id="tabs" role="tablist"></div><button class="ta" id="tr" aria-label="More categories">›</button></div>
 </section>
 <aside class="right" id="tk"></aside>
</div>
<button class="mbar" id="mbar"></button>
<div id="drawer"><nav id="dnav"></nav></div>
<div id="back"><div class="top"><button class="ib" id="bk" aria-label="Back to sell">←</button><h1 id="bt"></h1></div><div id="bb"></div></div>
<div id="login">
 <button class="tc" id="tcb">TIME CLOCK</button>
 <div class="brand"><img id="lg1" class="lgimg" alt=""><div>Nitz Cafe’</div></div>
 <div id="lgm">Connecting…</div>
 <div id="padw" style="display:none;width:100%;flex-direction:column;align-items:center"><div class="dots" id="dots"></div>
  <div class="pad" id="pad"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button disabled></button><button>0</button><button data-k="C">Clear</button></div></div>
 <div id="setupw"><div class="f"><label>Setup code (from the person who built the app)<input id="sc" autocomplete="off" autocapitalize="characters"></label><label>Your name<input id="sn" autocomplete="off"></label><label>Admin PIN-code (4 digits)<input id="sp" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><label>Repeat PIN-code<input id="sp2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><button class="btn" id="sgo">Create admin and start</button></div></div>
</div>
<div id="pa"></div>
<dialog id="dlg"></dialog>

let vw='day',anc=new Date(),lastKey='';
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function period(a,w){let s=sod(a),e;
 if(w==='week'){s.setDate(s.getDate()-(s.getDay()+6)%7);e=new Date(s);e.setDate(e.getDate()+7)}
 else if(w==='month'){s.setDate(1);e=new Date(s);e.setMonth(e.getMonth()+1)}
 else{e=new Date(s);e.setDate(e.getDate()+1)}
 return[s.getTime(),e.getTime()]}
function shift(a,w,n){const d=new Date(a);if(w==='day')d.setDate(d.getDate()+n);else if(w==='week')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n,1);return d}
function ring(f,txt,label,color,chg,cls,v,dc){f=Math.max(0,Math.min(1,f));const r=50,C=2*Math.PI*r,A=.75*C,an=(135+f*270)*Math.PI/180;
 return `<div class="rg ${cls||''}"><svg viewBox="0 0 120 120" role="img" aria-label="${label}: ${txt}"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${A} ${C}" transform="rotate(135 60 60)"/><circle class="arc" cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${f*A} ${C}" transform="rotate(135 60 60)"/><circle class="dot" style="--r:${f*270}" cx="${60+50*Math.cos(an)}" cy="${60+50*Math.sin(an)}" r="5" fill="${color}"/><text x="60" y="66" text-anchor="middle" font-size="${txt.length>8?13:17}" fill="currentColor" class="cu" data-v="${v}" data-d="${dc}">${txt}</text></svg><div class="rl">${label}</div><div class="rp" style="color:${color}">${chg}</div></div>`}
function countUp(){document.querySelectorAll('#bb .cu').forEach(el=>{const v=+el.dataset.v,d=+el.dataset.d,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=(v*e).toLocaleString('en-PH',{minimumFractionDigits:d,maximumFractionDigits:d});if(k<1&&el.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function chart(vals,tips,xl){const W=640,H=250,L0=46,R0=8,T0=10,B0=26,iw=W-L0-R0,ih=H-T0-B0,n=vals.length,mx=Math.max(...vals,1),mag=Math.pow(10,Math.floor(Math.log10(mx))),top=[1,2,2.5,5,10].find(k=>k*mag>=mx)*mag,bw=iw/n;
 const fk=v=>v>=1000?(+(v/1000).toFixed(1))+'K':String(Math.round(v));let g='';
 for(let i=0;i<=4;i++){const y=T0+ih-ih*i/4;g+=`<line x1="${L0}" x2="${W-R0}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L0-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fk(top*i/4)}</text>`}
 vals.forEach((v,i)=>{const h=ih*v/top;g+=`<rect class="br" style="--i:${i}" x="${L0+i*bw+bw*.15}" y="${T0+ih-h}" width="${bw*.7}" height="${v>0?Math.max(h,1.5):0}" fill="rgba(196,138,80,.35)" stroke="#c48a50"><title>${tips[i]}: ${money(v)}</title></rect>`;
  if(xl[i])g+=`<text x="${L0+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${xl[i]}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net sales chart">${g}</svg>`}
function vSales(){const key=vw+'|'+anc.toDateString(),an=key!==lastKey&&!matchMedia('(prefers-reduced-motion: reduce)').matches;lastKey=key;
 const[ps,pe]=period(anc,vw),[qs,qe]=period(shift(anc,vw,-1),vw);
 const L=S.sales.filter(s=>s.ts>=ps&&s.ts<pe),act=L.filter(s=>!s.voided),prv=S.sales.filter(s=>s.ts>=qs&&s.ts<qe&&!s.voided);
 const agg=a=>{const net=a.reduce((x,s)=>x+s.total-s.tax,0);return{c:a.length,net,avg:a.length?net/a.length:0}};
 const c=agg(act),p=agg(prv),pc=(x,y)=>y?(x-y)/y*100:null,fp=v=>v==null?'–':(v>0?'+':'')+(+v.toFixed(1))+'%',fr=(x,y)=>Math.max(x,y)>0?x/Math.max(x,y):0;
 const nf=v=>v.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
 const n=vw==='day'?24:vw==='week'?7:Math.round((pe-ps)/864e5),vals=Array(n).fill(0);
 act.forEach(s=>{const t=new Date(s.ts),i=vw==='day'?t.getHours():Math.min(n-1,Math.round((sod(t)-ps)/864e5));vals[i]+=s.total-s.tax});
 const tips=[],xl=[];for(let i=0;i<n;i++){
  if(vw==='day'){tips.push(String(i).padStart(2,'0')+':00');xl.push(i%2===0?String(i).padStart(2,'0'):'')}
  else if(vw==='week'){const d=new Date(ps+i*864e5);tips.push(d.toLocaleDateString('en-PH',{weekday:'short',day:'numeric',month:'short'}));xl.push(d.toLocaleDateString('en-PH',{weekday:'short'}))}
  else{tips.push(String(i+1));xl.push(i===0||(i+1)%5===0?String(i+1):'')}}
 const ttl=vw==='day'?anc.toLocaleDateString('en-PH',{day:'numeric',month:'long',year:anc.getFullYear()===new Date().getFullYear()?undefined:'numeric'}):vw==='week'?new Date(ps).toLocaleDateString('en-PH',{day:'numeric',month:'short'})+' – '+new Date(pe-864e5).toLocaleDateString('en-PH',{day:'numeric',month:'short'}):anc.toLocaleDateString('en-PH',{month:'long',year:'numeric'});
 const by={};act.forEach(s=>s.lines.forEach(l=>{by[l.name]=(by[l.name]||0)+l.qty*l.price}));const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,6);
 bb(`<div class="card${an?' an':''}"><div class="seg">${[['day','Day'],['week','Week'],['month','Month']].map(x=>`<button data-w="${x[0]}" aria-pressed="${vw===x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="dnav"><button class="ib" id="pv" aria-label="Previous period">‹</button><b>${ttl}</b><button class="ib" id="nx" aria-label="Next period" ${pe>Date.now()?'disabled':''}>›</button></div>
 <h2 style="text-align:center;font-weight:500">Sales summary</h2>
 <div class="rings">${ring(fr(c.c,p.c),String(c.c),'Receipts','#ecc891',fp(pc(c.c,p.c)),'',c.c,0)}${ring(fr(c.net,p.net),nf(c.net),'Net sales','#c48a50',fp(pc(c.net,p.net)),'mid',c.net,2)}${ring(fr(c.avg,p.avg),nf(c.avg),'Average sale','#b0643a',fp(pc(c.avg,p.avg)),'',c.avg,2)}</div>
 ${chart(vals,tips,xl)}<p style="color:var(--mute);text-align:center;margin:8px 0 0">Changes compare with the previous ${vw}. Net sales are after discounts and before tax. Voided receipts are not counted.</p></div>
 <div class="card"><h2>Top items</h2>${top.length?top.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join(''):'<p class="empty">No sales in this period yet.</p>'}</div>
 <div class="card"><div class="row"><h2>Receipts</h2><button class="btn bad sm" id="rst">Reset sales data</button></div>${L.length?`<div class="sc"><table><thead><tr><th>No.</th><th>Date</th><th>Cashier</th><th>Payment</th><th class="n">Total</th><th>Status</th><th></th></tr></thead><tbody>${L.map(s=>`<tr class="${s.voided?'vd':''}"><td>#${esc(s.no)}</td><td>${fmtT(s.ts)}</td><td>${esc(s.emp||'')}</td><td>${s.pay}</td><td class="n">${money(s.total)}</td><td>${s.voided?`<span class="badge" title="${esc(s.voidReason||'')}">Voided</span>`:s.edited?'Edited':'Paid'}</td><td class="acts"><button class="btn alt sm" data-r="${s._id}">View</button>${s.voided?'':`<button class="btn alt sm" data-ed="${s._id}">Edit</button><button class="btn alt sm" data-vd="${s._id}">Void</button>`}<button class="btn bad sm" data-dl="${s._id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No receipts in this period.</p>'}</div>`);
 if(an)countUp();
 $('#bb').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const g=b.dataset;
  if(g.w){vw=g.w;vSales()}else if(b.id==='pv'){anc=shift(anc,vw,-1);vSales()}else if(b.id==='nx'){anc=shift(anc,vw,1);vSales()}
  else if(b.id==='rst')resetDlg();else if(g.r)rcpt(S.sales.find(s=>s._id===g.r));else if(g.ed)editSale(g.ed);else if(g.vd)voidSale(g.vd);
  else if(g.dl){const s=S.sales.find(x=>x._id===g.dl);if(s&&confirm('Delete receipt #'+s.no+' permanently? This can’t be undone. Use Void to keep a record.'))W('pos_delete_sale',{p_id:g.dl}).catch(fail)}}}
function voidSale(id){const s=S.sales.find(x=>x._id===id);if(!s)return;

 const loc=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16),opt=(a,v)=>a.map(m=>`<option ${m===v?'selected':''}>${m}</option>`).join('');

 $('#o').onclick=async()=>{if(!L.length){$('#er').textContent='A receipt needs at least one item. Void or delete it instead.';return}
  const c=ce(),pm=$('#pm').value;

async function wipe(name,el){let n=0;for(;;){const sn=await col(name).limit(200).get();if(!sn.docs.length)break;

function empDlg(id){const e=S.emps.find(x=>x._id===id)||{name:'',role:'cashier',active:true};
 const d=dlg(`<h2>${id?'Edit employee':'Add employee'}</h2><div class="f"><label>Name<input id="n" value="${esc(e.name)}"></label>
 <label>Role<select id="r"><option value="cashier" ${e.role!=='admin'?'selected':''}>Cashier (sell only)</option><option value="admin" ${e.role==='admin'?'selected':''}>Admin (everything)</option></select></label>
 <label>${id?'New PIN-code (leave empty to keep)':'PIN-code (4 digits)'}<input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
 ${id?`<label><span><input id="a" type="checkbox" ${e.active!==false?'checked':''}> Can sign in</span></label>`:''}
 <p id="er" class="low" style="margin:0"></p><button class="btn" id="o">Save employee</button>${id?'<button class="btn bad" id="dl">Delete employee</button>':''}<button class="btn alt" id="x">Cancel</button></div>`);
 const err=t=>$('#er').textContent=t,admins=S.emps.filter(x=>x.role==='admin'&&x.active!==false&&x._id!==id).length;
 $('#x').onclick=()=>d.close();
 $('#o').onclick=async()=>{const n=$('#n').value.trim(),p=$('#p').value,role=$('#r').value,act=id?$('#a').checked:true;
  if(!n)return err('Enter a name.');if((!id||p)&&!/^\d{4}$/.test(p))return err('The PIN-code must be exactly 4 digits.');
  if(id&&!admins&&(role!=='admin'||!act))return err('Keep at least one active admin.');
  const data={name:n,role,active:act};
  try{await W('pos_save_staff',{p_staff:{id:id||null,name:n,role,active:act,pin:p||null}});d.close()}catch(x){err(x.message)}};
 if(id)$('#dl').onclick=async()=>{if(!admins&&e.role==='admin')return err('Keep at least one active admin.');if(!confirm('Delete this employee?'))return;try{await W('pos_delete_staff',{p_id:id});d.close()}catch(x){err(x.message)}}}
function vSet(){bb(`<div class="card"><h2>Store settings</h2><div class="f" style="max-width:340px"><label>Store name<input id="sn2" value="${esc(S.set.store)}"></label><label>Currency symbol<input id="cu" value="${esc(S.set.cur)}"></label><label>Tax rate (%)<input id="tx" type="number" min="0" step="any" value="${S.set.tax}"></label><button class="btn" id="sset">Save settings</button></div></div>`);
 $('#sset').onclick=async()=>{try{await W('pos_save_settings',{p_store:$('#sn2').value.trim(),p_cur:$('#cu').value,p_tax:Math.max(0,+$('#tx').value||0)});$('#bk').onclick()}catch(e){fail(e)}}}
dots();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
